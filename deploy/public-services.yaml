apiVersion: v1
kind: Service
metadata:
  name: grafana-public
  namespace: monitoring
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/instance: monitoring
    app.kubernetes.io/name: grafana
  ports:
    - name: http
      port: 3000
      targetPort: grafana
---
apiVersion: v1
kind: Service
metadata:
  name: argocd-public
  namespace: argocd
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: argocd-server
  ports:
    - name: http
      port: 8081
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: sonarqube-public
  namespace: quality
spec:
  type: LoadBalancer
  selector:
    app: sonarqube
  ports:
    - name: http
      port: 9000
      targetPort: 9000
