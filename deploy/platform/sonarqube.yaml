apiVersion: v1
kind: Namespace
metadata: { name: quality }
---
apiVersion: v1
kind: Service
metadata: { name: sonar-db, namespace: quality }
spec:
  selector: { app: sonar-db }
  ports: [{ port: 5432 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: sonar-db, namespace: quality }
spec:
  serviceName: sonar-db
  replicas: 1
  selector: { matchLabels: { app: sonar-db } }
  template:
    metadata: { labels: { app: sonar-db } }
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          envFrom: [{ secretRef: { name: sonar-secrets } }]
          env: [{ name: PGDATA, value: /var/lib/postgresql/data/pgdata }]
          resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { cpu: '1', memory: 1Gi } }
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec: { accessModes: [ReadWriteOnce], resources: { requests: { storage: 5Gi } } }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: sonar-data, namespace: quality }
spec: { accessModes: [ReadWriteOnce], resources: { requests: { storage: 5Gi } } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: sonarqube, namespace: quality }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: sonarqube } }
  template:
    metadata: { labels: { app: sonarqube } }
    spec:
      securityContext: { fsGroup: 1000 }
      containers:
        - name: sonarqube
          image: sonarqube:community
          ports: [{ containerPort: 9000 }]
          envFrom: [{ secretRef: { name: sonar-secrets } }]
          env: [{ name: SONAR_JDBC_URL, value: 'jdbc:postgresql://sonar-db:5432/sonar' }]
          resources: { requests: { cpu: '1', memory: 2Gi }, limits: { cpu: '2', memory: 4Gi } }
          startupProbe:
            {
              httpGet: { path: /api/system/status, port: 9000 },
              failureThreshold: 60,
              periodSeconds: 10
            }
          readinessProbe: { httpGet: { path: /api/system/status, port: 9000 }, periodSeconds: 10 }
          volumeMounts: [{ name: data, mountPath: /opt/sonarqube/data }]
      volumes: [{ name: data, persistentVolumeClaim: { claimName: sonar-data } }]
---
apiVersion: v1
kind: Service
metadata: { name: sonarqube, namespace: quality }
spec:
  selector: { app: sonarqube }
  ports: [{ port: 9000 }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sonarqube
  namespace: quality
  annotations: { cert-manager.io/cluster-issuer: letsencrypt }
spec:
  ingressClassName: traefik
  tls: [{ hosts: [sonar.CHANGE_ME], secretName: sonar-tls }]
  rules:
    - host: sonar.CHANGE_ME
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: sonarqube, port: { number: 9000 } } }
