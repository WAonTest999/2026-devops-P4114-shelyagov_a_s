apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: music-school
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/CHANGE_ME_OWNER/CHANGE_ME_REPO.git
    targetRevision: main
    path: deploy/app
  destination:
    server: https://kubernetes.default.svc
    namespace: school
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
