name: Telegram CI status
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
permissions: { actions: read, contents: read }
jobs:
  notify:
    if: vars.TELEGRAM_ENABLED == 'true' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      # workflow_run has secrets: only use the trusted main-branch notifier.
      - uses: actions/checkout@v4
        with: { ref: main, persist-credentials: false }
      - name: Send all job conclusions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: python3 scripts/notify_telegram.py
