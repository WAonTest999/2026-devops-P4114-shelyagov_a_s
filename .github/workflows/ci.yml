name: CI
on:
  push:
    branches: [lab1-preview]
    paths-ignore: ['deploy/app/kustomization.yaml', 'docs/**', '**.md']
  pull_request:
    branches: [lab1-preview]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: backend/go.mod, cache-dependency-path: backend/go.sum }
      - run: go build ./...
        working-directory: backend
      - run: go vet ./...
        working-directory: backend
  backend-test:
    needs: backend-build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          {
            POSTGRES_DB: school_test,
            POSTGRES_USER: postgres,
            POSTGRES_PASSWORD: test-only-password
          }
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: backend/go.mod, cache-dependency-path: backend/go.sum }
      - name: Unit and PostgreSQL concurrency tests
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgres://postgres:test-only-password@localhost:5432/school_test?sslmode=disable
        run: go test -race -coverprofile=coverage.out ./...
      - name: Require at least 80 percent backend coverage
        run: python3 scripts/check_go_coverage.py backend/coverage.out
      - uses: actions/upload-artifact@v4
        with: { name: backend-coverage, path: backend/coverage.out }
  frontend-build:
    needs: backend-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
  frontend-test:
    needs: frontend-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
        working-directory: frontend
      - run: npm run test:coverage
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        with: { name: frontend-coverage, path: frontend/coverage/lcov.info }