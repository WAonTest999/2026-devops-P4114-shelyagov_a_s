- name: Prepare Ubuntu VM for the DevOps labs
  hosts: lab
  become: true
  vars:
    install_kubernetes: false
    k3s_channel: stable
  tasks:
    - name: Install Docker and base utilities
      ansible.builtin.apt:
        name: [docker.io, docker-compose-v2, curl, ca-certificates, git, python3, openssl]
        state: present
        update_cache: true
    - name: Enable Docker
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true
    - name: Allow the SSH user to run Docker
      ansible.builtin.user:
        name: '{{ ansible_user }}'
        groups: docker
        append: true
    - name: Configure kernel for SonarQube Elasticsearch
      ansible.builtin.copy:
        dest: /etc/sysctl.d/90-sonarqube.conf
        content: "vm.max_map_count=524288\nfs.file-max=131072\n"
        mode: '0644'
      notify: Reload sysctl
    - name: Download official K3s installer
      ansible.builtin.get_url:
        url: https://get.k3s.io
        dest: /usr/local/bin/install-k3s.sh
        mode: '0700'
      when: install_kubernetes | bool
    - name: Install single-node Kubernetes with metrics-server and Traefik
      ansible.builtin.command: /usr/local/bin/install-k3s.sh
      environment:
        INSTALL_K3S_CHANNEL: '{{ k3s_channel }}'
        INSTALL_K3S_EXEC: 'server --write-kubeconfig-mode 600 --tls-san {{ inventory_hostname }}'
      args:
        creates: /etc/systemd/system/k3s.service
      when: install_kubernetes | bool
  handlers:
    - name: Reload sysctl
      ansible.builtin.command: sysctl --system
